<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a"/>
  <!-- Code brackets -->
  <text x="4" y="44" font-family="monospace, 'Courier New'" font-size="24" font-weight="700" fill="#38bdf8" opacity="0.6">&lt;</text>
  <!-- NN monogram -->
  <text x="15" y="44" font-family="'Montserrat', Arial, sans-serif" font-size="30" font-weight="700" fill="url(#favGrad)" letter-spacing="-2">NN</text>
  <!-- Closing bracket -->
  <text x="48" y="44" font-family="monospace, 'Courier New'" font-size="24" font-weight="700" fill="#38bdf8" opacity="0.6">/&gt;</text>
</svg>
